[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "lh_portal"
description = "telegram bot for lautis hannover"
#long_description = file: src/README_package.md
#long_description_content_type = text/markdown
authors = [{name = "Lautis Hannover", email = "hallo@lautis-hannover.de"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]"
]
dynamic = ["version"]

[project.optional-dependencies]


[project.scripts]
lhportal = "lh_portal.__cli__:main"

[tool.setuptools.dynamic]
version = {attr = "lh_portal.__version__"}
